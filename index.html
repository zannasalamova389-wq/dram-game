<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Рисовалка</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    text-align: center;
  }
  h1 { color: #333; font-size: 20px; }
  #canvas {
    background: #fff;
    border: 2px solid #333;
    cursor: crosshair;
    display: block;
    margin: 0 auto;
  }
  .palette {
    margin: 15px auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 600px;
  }
  .color {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #ccc;
    cursor: pointer;
  }
  .color.active { border-color: #333; transform: scale(1.15); }
  .buttons {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
  }
  #clearBtn { background: #e74c3c; }
  #saveBtn  { background: #27ae60; }
</style>
</head>
<body>

  <h1>🎨 Рисовалка</h1>

  <canvas id="canvas" width="600" height="400"></canvas>

  <div class="palette" id="palette"></div>

  <div class="buttons">
    <button id="clearBtn">Очистить</button>
    <button id="saveBtn">Сохранить</button>
  </div>

<script>
// ==== Настройки ====
const COLORS = [
  '#FF0000', '#FF6B00', '#FFD700', '#00C853',
  '#00B0FF', '#2962FF', '#8E24AA', '#FF4081',
  '#795548', '#000000', '#FFFFFF', '#9E9E9E'
];

// ==== Элементы ====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const palette = document.getElementById('palette');

// ==== Переменные ====
let currentColor = '#FF0000';
let isDrawing = false;

// ==== Белый фон ====
ctx.fillStyle = '#FFFFFF';
ctx.fillRect(0, 0, canvas.width, canvas.height);

// ==== Палитра ====
COLORS.forEach((color, index) => {
  const btn = document.createElement('div');
  btn.className = 'color';
  btn.style.background = color;
  if (color === '#FFFFFF') btn.style.border = '3px dashed #999';
  if (index === 0) btn.classList.add('active');

  btn.addEventListener('click', () => {
    document.querySelectorAll('.color').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentColor = color;
    console.log('Цвет:', currentColor);
  });

  palette.appendChild(btn);
});

// ==== Рисование ====
canvas.addEventListener('mousedown', (e) => {
  console.log('mousedown!', e.button);
  if (e.button !== 0) return; // только левая

  isDrawing = true;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  ctx.beginPath();
  ctx.arc(x, y, 10, 0, Math.PI * 2);
  ctx.fillStyle = currentColor;
  ctx.fill();
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDrawing) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  ctx.strokeStyle = currentColor;
  ctx.lineWidth = 20;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y);
});

canvas.addEventListener('mouseup', () => { isDrawing = false; });
canvas.addEventListener('mouseleave', () => { isDrawing = false; });

// ==== Кнопки ====
document.getElementById('clearBtn').addEventListener('click', () => {
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
});

document.getElementById('saveBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'my-drawing.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

console.log('Рисовалка запущена');
</script>
</body>
</html>
